<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Graphics</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let colors = ["red", "yellow", "blue", "green", "orange", "pink", "cyan", "purple"];

        function drawFlower(x, y) {

            for (let i = 0; i < 36; i++) {

                ctx.beginPath();

                ctx.strokeStyle = colors[i % colors.length];

                ctx.arc(x, y, 100, 0, Math.PI * 2);

                ctx.stroke();

                ctx.translate(x, y);
                ctx.rotate(Math.PI / 18);
                ctx.translate(-x, -y);
            }
        }

        function drawStars() {

            for (let i = 0; i < 50; i++) {

                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;

                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];

                ctx.beginPath();

                ctx.arc(x, y, 3, 0, Math.PI * 2);

                ctx.fill();
            }
        }

        // Background stars
        drawStars();

        // Flower graphics
        drawFlower(canvas.width / 2, canvas.height / 2);

        // Text
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("WELCOME TO JS GRAPHICS", 250, 80);

    </script>

</body>

</html>
